<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="display">0</div>
        <div class="buttons">
           <button class="btn" id="+">+
           </button>
    <button class="btn" id="7">7</button>
    <button class="btn" id="8">8</button>
    <button class="btn" id="9">9</button>
<button class="btn" id="-">-</button>
    <button class="btn" id="4">4</button>
    <button class="btn" id="5">5</button>
    <button class="btn" id="6">6</button>
    <button class="btn" id="*">*</button>
    <button class="btn" id="1">1</button>
    <button class="btn" id="2">2</button>
    <button class="btn" id="3">3</button>
    <button class="btn" id="/">/</button>
        <button class="btn" id="0">0</button>
    <button class="btn" id=".">.</button>
    <button class="btn" id="Enter">=</button>
    <button class="btn" id="sqrt">x^2</button>
    <button class="btn" id="log">log
    </button>
    <button class="btn" id="open-brace">(</button>
     <button class="btn" id="close-brace">)</button>
<button class="btn" id="Escape">C</button>
<button class="btn" id="Backspace">
<i class="fa-solid fa-delete-left"></i>
    </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
