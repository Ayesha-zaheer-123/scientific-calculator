<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{
    margin:0;
    padding:0;
    box-sizing: border-box;
}
body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background-color: #f0f0f0;
  margin: 0;
  padding: 15px;
}
    .calculator {
  width: 320px;
  max-width: 100%;
  background-color: #1e1e1e;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 2px 2px 2px 2px  black;
}
.display {
  background-color: #2a2a2a;
  color: white;
  font-size: 40px;
  text-align: left;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 15px;
  overflow-x: auto;
  white-space: nowrap;
}
.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
  .btn {
  height:50px;
  border-radius:50%;
  border:none;
  padding:10px;
  cursor:pointer;
font-size:24px;
 transition: transform 0.1s ease;
}
.btn:hover{
    transform: scale(0.9);
}
[id="+"],[id="-"],[id="*"],[id="/"],[id="Escape"]{
    background-color: pink;
}
[id="0"], [id="1"], [id="2"], [id="3"], [id="4"],
[id="5"], [id="6"], [id="7"], [id="8"], [id="9"],[id="."] {
  background-color: skyblue;
}
#Enter{
background-color:rgb(199, 199, 235)
}
#Backspace{
     background-color: pink;
}
#open-brace,#close-brace,#sqrt,#log{
    background-color: pink;
}

/* Tablet */
@media (max-width: 480px) {
    .calculator{
        width: 100%;
        padding: 15px;
    }
    .display{
        font-size: 32px;
        padding: 15px;
    }
    .btn{
        height: 45px;
        font-size: 20px;
    }
}

/* Very small phones */
@media (max-width: 360px) {
    .display{
        font-size: 26px;
        padding: 12px;
    }
    .btn{
        height: 40px;
        font-size: 18px;
        padding: 6px;
    }
    .buttons{
        gap: 6px;
    }
}
</style>
</head>
<body>
    <div class="calculator">
        <div class="display">0</div>
        <div class="buttons">
           <button class="btn" id="+">+
           </button>
    <button class="btn" id="7">7</button>
    <button class="btn" id="8">8</button>
    <button class="btn" id="9">9</button>
<button class="btn" id="-">-</button>
    <button class="btn" id="4">4</button>
    <button class="btn" id="5">5</button>
    <button class="btn" id="6">6</button>
    <button class="btn" id="*">*</button>
    <button class="btn" id="1">1</button>
    <button class="btn" id="2">2</button>
    <button class="btn" id="3">3</button>
    <button class="btn" id="/">/</button>
        <button class="btn" id="0">0</button>
    <button class="btn" id=".">.</button>
    <button class="btn" id="Enter">=</button>
    <button class="btn" id="sqrt">x^2</button>
    <button class="btn" id="log">log
    </button>
    <button class="btn" id="open-brace">(</button>
     <button class="btn" id="close-brace">)</button>
<button class="btn" id="Escape">C</button>
<button class="btn" id="Backspace">
<i class="fa-solid fa-delete-left"></i>
    </button>
        </div>
    </div>
    <script>

        let display=document.querySelector(".display")
        display.innerText="";
        let buttoncontainer=document.querySelector(".buttons");
        buttoncontainer.addEventListener("click",(e)=>{
let element=document.getElementById(e.target.id);
if(element.id=="Escape") {
    cleardisplay();
}else if(element.id=="Enter"){
    calculateresult();
}else if(element.id=="Backspace") {
    backspace();
}else if(element.id=="sqrt") {
    squaret();
}else if(element.id=="log") {
    logarithm();
}else{
showdisplay(element);
}
        })
        function logarithm() {
            let result=Number(display.innerText);
            if(result<=0) {
                display.innerText="Error";
            }
            else{
                let num=Math.log10(result);
                if(num.toString().indexOf(".")!=-1){
                   display.innerText=num.toFixed(8);
                }else{
                    display.innerText=num;
                }

            }
        }
        function squaret() {
 let num = Number(display.innerText);
  let result = Math.pow(num, 2);
  if(result.toString().indexOf(".")!=-1) {
    display.innerText=result.toFixed(4);
  }else{
display.innerText=result;
  }
        }
        function cleardisplay() {
            display.innerText="";
        }

        function calculateresult() {
            try{
                let result=eval(display.innerText);
                display.innerText=result;
                if (isNaN(result) || !isFinite(result)) {
  display.innerText = "Error";
}

            }catch{
                display.innerText="Error";
            }

        }
        function backspace() {
             display.innerText = display.innerText.slice(0, -1);
        }
        function showdisplay(element) {
            if(display.innerText=="Error") {
                display.innerText="";
            }
            display.innerText+=element.innerText;
        }
    </script>
</body>
</html>
